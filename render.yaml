services:
  # ── Backend (FastAPI / Python) ──────────────────────────────
  - type: web
    name: maicrobots-backend
    runtime: python
    repo: https://github.com/JohnSamuel85/HINDSIGHT-MAICROBOTS.git
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HINDSIGHT_API_KEY
        sync: false  # You'll set this in the Render dashboard
      - key: HINDSIGHT_BANK_ID
        value: MAICROBOTS
      - key: HINDSIGHT_ENDPOINT
        value: https://api.hindsight.vectorize.io
      - key: GEMINI_API_KEY
        sync: false  # You'll set this in the Render dashboard
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: FRONTEND_URL
        value: https://maicrobots-frontend.onrender.com
      - key: PYTHON_VERSION
        value: "3.11.6"

  # ── Frontend (Next.js / Node) ───────────────────────────────
  - type: web
    name: maicrobots-frontend
    runtime: node
    repo: https://github.com/JohnSamuel85/HINDSIGHT-MAICROBOTS.git
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://maicrobots-backend.onrender.com
      - key: NODE_VERSION
        value: "20.11.0"
